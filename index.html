<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light dark; }
    body {
      font: 15px/1.4 system-ui, sans-serif;
      max-width: 40rem;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    h1 {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 1.1rem;
      font-weight: 600;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.55rem 0.4rem; border-bottom: 1px solid color-mix(in srgb, currentColor 12%, transparent); }
    td.open { white-space: nowrap; padding-right: 1.75rem; }
    td.pages-col { white-space: nowrap; padding-left: 0.75rem; }
    th { font-weight: 500; color: color-mix(in srgb, currentColor 55%, transparent); font-size: 0.8rem; }
    .light {
      display: inline-block;
      width: 0.7rem;
      height: 0.7rem;
      border-radius: 50%;
      background: #999;
      vertical-align: middle;
    }
    .green { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
    .yellow { background: #eab308; box-shadow: 0 0 6px #eab308; }
    .red { background: #ef4444; box-shadow: 0 0 6px #ef4444; }
    a { color: inherit; }
    .pages, .name, .repos {
      display: inline-flex;
      align-items: center;
    }
    .pages { gap: 0.28rem; }
    .name { gap: 0.4rem; }
    .repos { gap: 0.35rem; }
    .gh {
      display: inline-flex;
      align-items: center;
      color: inherit;
      opacity: 0.85;
    }
    .gh svg { display: block; flex-shrink: 0; }
    .key { font-size: 0.9rem; line-height: 1; text-decoration: none; }
    .code { margin-left: 0.4rem; font-variant-numeric: tabular-nums; color: color-mix(in srgb, currentColor 55%, transparent); font-size: 0.8rem; }
  </style>
</head>
<body>
  <h1>Projects <a class="gh" id="site-gh" href="https://benjkn.github.io/my_public_website/" target="_blank" rel="noopener" title="GitHub Pages" aria-label="GitHub Pages"></a></h1>
  <table>
    <thead>
      <tr><th>Project</th><th>Health</th><th></th><th></th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <script>
    const URLS = {
      benjkn: "https://benjkn.playfree.party/",
      lotbook: "https://lotbook.playfree.party/",
      rides: "https://rides.playfree.party/",
      slack: "https://slack.playfree.party/",
      "telegram-bot": "https://telegram-bot.playfree.party/",
      games_101: "https://games-101.playfree.party/",
      personal_tracking: "https://personal-tracking.playfree.party/",
      ml_pred: "https://ml-pred.playfree.party/",
    };
    const PAGES = {
      benjkn: "https://benjkn.github.io/my_public_website/",
      games_101: "https://benjkn.github.io/games",
    };
    const REPOS = {
      benjkn: {
        private: "https://github.com/benjkn/personal_website",
        public: "https://github.com/benjkn/my_public_website",
      },
      lotbook: { private: "https://github.com/benjkn/lotbook" },
      rides: { private: "https://github.com/benjkn/learning" },
      slack: { private: "https://github.com/benjkn/my_slack_mamager" },
      "telegram-bot": { private: "https://github.com/benjkn/tele_bot" },
      games_101: {
        private: "https://github.com/benjkn/games_101",
        public: "https://github.com/benjkn/games",
      },
      personal_tracking: { private: "https://github.com/benjkn/personal-tracking" },
      ml_pred: { private: "https://github.com/benjkn/ML_test" },
    };
    const GITHUB = "https://github.com/benjkn";
    const GH_ICON = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="13" height="13" fill="currentColor" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>`;
    document.getElementById("site-gh").innerHTML = GH_ICON;
    const RANK = { green: 0, yellow: 1, red: 2 };

    function healthUrl(url) {
      const u = new URL(url);
      u.pathname = "/health";
      return u.href;
    }

    async function ping(url) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 4000);
      try {
        const res = await fetch(url + "?_=" + Date.now(), { signal: ctrl.signal });
        let body = null;
        try { body = await res.json(); } catch {}
        const healthy = body?.ok === true || res.ok;
        const color = healthy ? "green" : res.status >= 500 ? "red" : "yellow";
        return { color, code: res.status, body };
      } catch (err) {
        return { color: "red", code: err.name === "AbortError" ? "timeout" : "failed", body: null };
      } finally {
        clearTimeout(timer);
      }
    }

    let projects = [];
    const rows = document.getElementById("rows");

    function reposFor(name) {
      const raw = REPOS[name];
      if (!raw) return [];
      return ["private", "public"].flatMap(kind => raw[kind] ? [{ kind, url: raw[kind] }] : []);
    }

    function setProjects(names) {
      projects = names.map(name => ({ name, url: URLS[name] }));
      render();
      refresh();
    }

    function sortProjects() {
      projects.sort((a, b) => {
        const ra = RANK[a.color] ?? 3;
        const rb = RANK[b.color] ?? 3;
        if (ra !== rb) return ra - rb;
        return a.name.localeCompare(b.name);
      });
    }

    function render() {
      rows.innerHTML = projects.map(p => {
        const extra = PAGES[p.name];
        const pages = extra
          ? `<span class="pages"><a href="${extra}" target="_blank" rel="noopener">Pages</a><a class="gh" href="${GITHUB}" target="_blank" rel="noopener" title="GitHub profile" aria-label="GitHub profile">${GH_ICON}</a></span>`
          : "";
        const health = healthUrl(p.url);
        const light = p.color || "yellow";
        const tip = p.meta ? Object.entries(p.meta).map(([k, v]) => `${k}: ${v}`).join(" · ") : "";
        const repos = reposFor(p.name).map(r =>
          `<a class="gh" href="${r.url}" target="_blank" rel="noopener" title="${r.kind} repo" aria-label="${r.kind} GitHub repo">${r.kind === "private" ? `<span class="key">🔑</span>` : GH_ICON}</a>`
        ).join("");
        return `
          <tr>
            <td><span class="name">${p.name}<span class="repos">${repos}</span></span></td>
            <td><span class="light ${light}"></span><a class="code" href="${health}" target="_blank" rel="noopener" title="${tip}">${p.code ?? ""}</a></td>
            <td class="open"><a href="${p.url}" target="_blank" rel="noopener">open</a></td>
            <td class="pages-col">${pages}</td>
          </tr>
        `;
      }).join("");
    }

    async function refresh() {
      await Promise.all(projects.map(async p => {
        const { color, code, body } = await ping(healthUrl(p.url));
        p.color = color;
        p.code = code;
        p.meta = body;
      }));
      sortProjects();
      render();
    }

    setProjects(Object.keys(URLS));
  </script>
</body>
</html>
