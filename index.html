<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light dark; }
    body {
      font: 15px/1.4 system-ui, sans-serif;
      max-width: 40rem;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    h1 { font-size: 1.1rem; font-weight: 600; }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
    button, .linkish {
      font: inherit;
      font-size: 0.8rem;
      background: none;
      border: 0;
      padding: 0;
      color: inherit;
      text-decoration: underline;
      cursor: pointer;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.55rem 0.4rem; border-bottom: 1px solid color-mix(in srgb, currentColor 12%, transparent); }
    td.open { white-space: nowrap; padding-right: 1.75rem; }
    td.pages-col { white-space: nowrap; padding-left: 0.75rem; }
    th { font-weight: 500; color: color-mix(in srgb, currentColor 55%, transparent); font-size: 0.8rem; }
    .light {
      display: inline-block;
      width: 0.7rem;
      height: 0.7rem;
      border-radius: 50%;
      background: #999;
      vertical-align: middle;
    }
    .green { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
    .yellow { background: #eab308; box-shadow: 0 0 6px #eab308; }
    .red { background: #ef4444; box-shadow: 0 0 6px #ef4444; }
    a { color: inherit; }
    .pages {
      display: inline-flex;
      align-items: center;
      gap: 0.28rem;
    }
    .gh {
      display: inline-flex;
      color: inherit;
      opacity: 0.85;
    }
    .gh svg { display: block; }
    .name {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .repos {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .gh-private { position: relative; }
    .key {
      font-size: 0.65rem;
      line-height: 1;
      margin-left: 0.08rem;
    }
    .ip-mark { color: #ef4444; font-size: 0.75em; }
    .code { margin-left: 0.4rem; font-variant-numeric: tabular-nums; color: color-mix(in srgb, currentColor 55%, transparent); font-size: 0.8rem; }
  </style>
</head>
<body>
  <header>
    <h1>Projects</h1>
    <!-- <button type="button" id="pick">Choose Projects folder</button> -->
  </header>
  <!-- <input type="file" id="folder" webkitdirectory hidden> -->
  <table>
    <thead>
      <tr><th>Project</th><th>Health</th><th></th><th></th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <script>
    const URLS = {
      benjkn: "https://benjkn.playfree.party/",
      lotbook: "https://lotbook.playfree.party/",
      rides: "https://rides.playfree.party/",
      slack: "https://slack.playfree.party/",
      "telegram-bot": "https://telegram-bot.playfree.party/",
      games_101: "https://games-101.playfree.party/",
      personal_tracking: "https://personal-tracking.playfree.party/",
      ml_pred: "https://ml-pred.playfree.party/",
    };
    const PAGES = {
      benjkn: "https://benjkn.github.io/my_public_website/",
      games_101: "https://benjkn.github.io/games",
    };
    const REPOS = {
      benjkn: {
        "private": "https://github.com/benjkn/personal_website",
        "public": "https://github.com/benjkn/my_public_website"
      },
      lotbook: {
        "private": "https://github.com/benjkn/lotbook"
      },
      rides: {
        "private": "https://github.com/benjkn/learning"
      },
      slack: {
        "private": "https://github.com/benjkn/my_slack_mamager"
      },
      "telegram-bot": {
        "private": "https://github.com/benjkn/tele_bot"
      },
      games_101: {
        "private": "https://github.com/benjkn/games_101",
        "public": "https://github.com/benjkn/games"
      },
      personal_tracking: {
        "private": "https://github.com/benjkn/personal-tracking"
      },
      ml_pred: {
        "private": "https://github.com/benjkn/ML_test"
      },
    };
    const GITHUB = "https://github.com/benjkn";
    const GH_ICON = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="13" height="13" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"/></svg>`;

    function usesIp(url) {
      try {
        return /^\d{1,3}(\.\d{1,3}){3}$/.test(new URL(url).hostname);
      } catch {
        return false;
      }
    }

    function healthUrl(url) {
      const u = new URL(url);
      u.pathname = "/health";
      u.search = "";
      u.hash = "";
      return u.href;
    }

    function bodyHealthy(body) {
      return body?.ok === true;
    }

    async function ping(url) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 4000);
      try {
        const res = await fetch(url + "?_=" + Date.now(), { signal: ctrl.signal });
        let body = null;
        try { body = await res.json(); } catch {}
        const healthy = bodyHealthy(body) ?? res.ok;
        const color = healthy ? "green" : res.status >= 500 ? "red" : "yellow";
        if (url.includes("ml-pred")) {
          console.log(url, res.status, body);
        }
        return { color, code: res.status, body };
      } catch (err) {
        const code = err.name === "AbortError" ? "timeout" : "failed";
        return { color: "red", code, body: null };
      } finally {
        clearTimeout(timer);
      }
    }

    let projects = [];
    const rows = document.getElementById("rows");

    const RANK = { green: 0, yellow: 1, red: 2 };

    function urlFor(name) {
      if (URLS[name]) return URLS[name];
      const lower = name.toLowerCase();
      const key = Object.keys(URLS).find(k => k.toLowerCase() === lower);
      return key ? URLS[key] : undefined;
    }

    function pagesFor(name) {
      if (PAGES[name]) return PAGES[name];
      const lower = name.toLowerCase();
      const key = Object.keys(PAGES).find(k => k.toLowerCase() === lower);
      return key ? PAGES[key] : undefined;
    }

    function reposFor(name) {
      const raw = REPOS[name] || REPOS[Object.keys(REPOS).find(k => k.toLowerCase() === name.toLowerCase())];
      if (!raw) return [];
      return ["private", "public"].flatMap(kind => raw[kind] ? [{ kind, url: raw[kind] }] : []);
    }

    function urlKey(name) {
      if (URLS[name]) return name;
      const lower = name.toLowerCase();
      return Object.keys(URLS).find(k => k.toLowerCase() === lower);
    }

    function setProjects(folderNames) {
      projects = folderNames
        .sort((a, b) => a.localeCompare(b))
        .map(name => {
          const url = urlFor(name);
          return { name, url, color: url ? undefined : "red" };
        });
      render();
      refresh();
    }

    function sortProjects() {
      projects.sort((a, b) => {
        const ra = !a.url ? 3 : a.color == null ? 3 : RANK[a.color];
        const rb = !b.url ? 3 : b.color == null ? 3 : RANK[b.color];
        if (ra !== rb) return ra - rb;
        return a.name.localeCompare(b.name);
      });
    }

    function render() {
      rows.innerHTML = projects.map(p => {
        const star = p.url && usesIp(p.url) ? `<span class="ip-mark">*</span>` : "";
        const extra = pagesFor(p.name);
        const link = p.url
          ? `<a href="${p.url}" target="_blank" rel="noopener">open</a>${star}`
          : "";
        const pages = extra
          ? `<span class="pages"><a href="${extra}" target="_blank" rel="noopener">Pages</a><a class="gh" href="${GITHUB}" target="_blank" rel="noopener" title="GitHub profile" aria-label="GitHub profile">${GH_ICON}</a></span>`
          : "";
        const health = p.url ? healthUrl(p.url) : "";
        const light = p.url ? (p.color || "yellow") : "red";
        const code = p.code ?? "";
        const tip = p.meta ? Object.entries(p.meta).map(([k, v]) => `${k}: ${v}`).join(" · ") : "";
        const healthCell = health
          ? `<span class="light ${light}"></span><a class="code" href="${health}" target="_blank" rel="noopener" title="${tip}">${code}</a>`
          : `<span class="light red"></span>`;
        return `
          <tr>
            <td><span class="name">${p.name}<span class="repos">${reposFor(p.name).map(r =>
              `<a class="gh${r.kind === "private" ? " gh-private" : ""}" href="${r.url}" target="_blank" rel="noopener" title="${r.kind} repo" aria-label="${r.kind} GitHub repo">${GH_ICON}${r.kind === "private" ? `<span class="key">🔑</span>` : ""}</a>`
            ).join("")}</span></span></td>
            <td>${healthCell}</td>
            <td class="open">${link}</td>
            <td class="pages-col">${pages}</td>
          </tr>
        `;
      }).join("");
    }

    async function refresh() {
      await Promise.all(projects.map(async p => {
        if (!p.url) return;
        const { color, code, body } = await ping(healthUrl(p.url));
        p.color = color;
        p.code = code;
        p.meta = body;
      }));
      sortProjects();
      render();
    }

    function openDb() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open("projects-board", 1);
        req.onupgradeneeded = () => req.result.createObjectStore("handles");
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveHandle(handle) {
      const db = await openDb();
      await new Promise((resolve, reject) => {
        const tx = db.transaction("handles", "readwrite");
        tx.objectStore("handles").put(handle, "projects");
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    }

    async function loadHandle() {
      const db = await openDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction("handles", "readonly");
        const req = tx.objectStore("handles").get("projects");
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function namesFromDir(dir) {
      const names = [];
      for await (const [name, handle] of dir.entries()) {
        if (handle.kind === "directory") names.push(name);
      }
      return names;
    }

    async function useDir(dir) {
      const perm = await dir.queryPermission({ mode: "read" });
      if (perm !== "granted") {
        if (await dir.requestPermission({ mode: "read" }) !== "granted") return false;
      }
      setProjects(await namesFromDir(dir));
      return true;
    }

    /*
    document.getElementById("pick").onclick = async () => {
      if (window.showDirectoryPicker) {
        const dir = await showDirectoryPicker();
        await saveHandle(dir);
        await useDir(dir);
        return;
      }
      document.getElementById("folder").click();
    };

    document.getElementById("folder").onchange = e => {
      const names = new Set();
      for (const file of e.target.files) {
        const top = file.webkitRelativePath.split("/")[0];
        if (top) names.add(top);
      }
      setProjects(names);
    };

    (async () => {
      try {
        const dir = await loadHandle();
        if (dir) await useDir(dir);
      } catch {}
    })();
    */

    setProjects(Object.keys(URLS));

    // setInterval(refresh, 5 * 60 * 1000);
  </script>
</body>
</html>
